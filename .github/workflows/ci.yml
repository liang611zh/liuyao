name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check file structure
        run: |
          echo "Checking required files..."
          for f in index.html src/main.tsx src/App.tsx src/index.css \
                   src/lib/config.ts src/lib/i18n.ts src/lib/data.ts src/lib/paipan.ts \
                   src/lib/ai.ts src/lib/analytics.ts src/lib/history.ts src/lib/supabase.ts \
                   supabase/schema.sql scripts/build-config.mjs vite.config.ts; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              exit 1
            fi
            echo "✅ $f"
          done

      - name: Typecheck
        run: npm run typecheck

      # 排盘正确性测试：八卦位序、64 卦查表、纳甲内外卦、六神起例、
      # 干支历与旬空、完整排盘比对传统标准答案、卦例记录时区无关性。
      # 详见 test/paipan.test.ts
      - name: Verify divination correctness
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate built HTML
        run: npx --yes html-validate@latest dist/index.html

      # src/lib 是框架无关的纯逻辑层，测试直接在 node 里 import 它。
      # 一旦这里混进 React，测试就得拖进整个渲染环境，那道防线也就废了。
      - name: Keep the logic layer framework-free
        run: |
          if grep -rlE "from ['\"](react|react-dom)" src/lib/; then
            echo "❌ src/lib/ 不应依赖 React —— 那层要能在 node 里直接跑测试"
            exit 1
          fi
          echo "✅ src/lib/ 保持框架无关"

      - name: Check for sensitive files
        run: |
          echo "Checking for sensitive files..."
          FOUND=0
          for pattern in .env .env.local credentials.json *.key *.pem; do
            if ls $pattern 2>/dev/null; then
              echo "❌ Sensitive file found: $pattern"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "✅ No sensitive files found"

      - name: Check analytics privacy invariants
        run: |
          echo "Ensuring analytics never captures question text or API keys..."
          if grep -rnE "track\([^)]*(question|apiKey|api_key)\s*[,:)]" src/ | grep -v "has_question"; then
            echo "❌ Analytics may be capturing sensitive values"
            exit 1
          fi
          if ! grep -q "autocapture: false" src/lib/analytics.ts; then
            echo "❌ autocapture must stay disabled (it would capture the question textarea)"
            exit 1
          fi
          if ! grep -q "disable_session_recording: true" src/lib/analytics.ts; then
            echo "❌ session recording must stay disabled"
            exit 1
          fi
          echo "✅ Analytics privacy invariants hold"

      # 本项目开源。真实 key 由 scripts/build-config.mjs 在部署时从环境变量注入，
      # 仓库里的 src/lib/config.ts 必须保持空值。这一步是误提交的兜底闸门。
      #
      # 注意：上面的 build 步骤会就地改写这个文件，所以先还原再检查。
      - name: Ensure committed config stays blank
        run: |
          git checkout -- src/lib/config.ts
          if grep -qE "^export const (POSTHOG_KEY|SUPABASE_URL|SUPABASE_ANON_KEY) = ['\"].+['\"]" src/lib/config.ts; then
            echo "❌ src/lib/config.ts contains a real value — it must stay blank in the repo."
            echo "   Set the value in the deployment environment instead (see scripts/build-config.mjs)."
            exit 1
          fi
          echo "✅ Committed config is blank"

      # 扫描 git 跟踪的所有文件。Supabase 的 JWT 会解出 payload 看 role，
      # 而不是搜关键词 —— 文档里写「不要提交 service_role key」不该被判为泄露
      - name: Scan for leaked secrets
        run: node scripts/scan-secrets.mjs

      # anon key 是公开的且允许自助注册，所以必须假设任何人都能拿到合法身份。
      # 防线全在 schema 里，这几条被删掉等于把所有用户的占问内容暴露出去。
      - name: Verify database hardening
        run: |
          fail=0
          need() {
            if ! grep -q "$1" supabase/schema.sql; then
              echo "❌ $2"
              fail=1
            fi
          }
          need "enable row level security" \
               "RLS 必须开启，否则任何拿到 anon key 的人都能读到全部用户的占问内容"
          for op in select insert delete; do
            need "for $op" "缺少 $op 的 RLS 策略"
          done
          need "revoke all on public.readings from anon" \
               "必须撤销 anon 对 readings 的授权（纵深防御）"
          need "enforce_readings_quota" \
               "必须保留每用户配额触发器，否则一个脚本就能写爆免费额度"
          need "set search_path = ''" \
               "SECURITY DEFINER 函数必须锁定 search_path"
          need "revoke all on public.profiles from anon" \
               "必须撤销 anon 对 profiles 的授权"
          need "grant update (nickname) on public.profiles" \
               "profiles 必须用列级授权只放开 nickname —— RLS 管不了列，否则用户能改自己的 email 副本"
          # readings 刻意不开 UPDATE：卦例落库后不可篡改。
          # profiles 有 UPDATE 策略是预期内的（改昵称），且已用列级授权限死到 nickname
          if grep -q "on public.readings for update" supabase/schema.sql; then
            echo "❌ readings 不应有 UPDATE 策略 —— 卦例应当不可篡改"
            fail=1
          fi
          [ $fail -eq 0 ] || exit 1
          echo "✅ RLS、anon 撤权、列级授权、配额触发器、search_path 均就位；readings 不可篡改"

      - name: Verify build-config rejects secrets
        run: |
          set +e
          SR=$(node -e "console.log('eyJhbGciOiJIUzI1NiJ9.'+Buffer.from(JSON.stringify({role:'service_role'})).toString('base64url')+'.sig')")
          SUPABASE_URL=https://abcdefgh.supabase.co SUPABASE_ANON_KEY="$SR" \
            node scripts/build-config.mjs >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "❌ build-config.mjs accepted a service_role key"
            exit 1
          fi
          POSTHOG_KEY=sk-ant-api03-aaaaaaaaaaaaaaaaaaaaaa node scripts/build-config.mjs >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "❌ build-config.mjs accepted a model API key"
            exit 1
          fi
          set -e
          # 把仓库里的空壳配置还原，避免上面的失败尝试留下残迹
          # （拦截逻辑在写文件之前就退出，这里只是防御性兜底）
          git checkout -- src/lib/config.ts || true
          echo "✅ build-config.mjs rejects secrets"
